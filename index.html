<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paris — commute time to the office</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* ------------------------------------------------------------------
     Sequential "semantic heat" ramp (green -> yellow -> red).
     Multi-hue is legal here as semantic heat, shipped with a scale legend.
     Steps were generated in OKLCH with MONOTONE lightness and validated
     as composited at 68% over the CARTO light surface (#f2f0eb), which is
     what the eye actually sees:
       L 0.898 .843 .785 .725 .660 .580 .518  (strictly decreasing)
       min adjacent dL 0.055 ; contrast vs basemap 1.14 -> 5.15
     Monotone lightness is what keeps the order readable under protanopia/
     deuteranopia and in grayscale, since hue alone never carries the value.
     ------------------------------------------------------------------ */
  :root {
    color-scheme: light;
    --heat-1:#74f79e; --heat-2:#8ad545; --heat-3:#afa600; --heat-4:#b97800;
    --heat-5:#b64700; --heat-6:#aa0700; --heat-7:#710014;
    --basemap-tone:#f2f0eb;
    --cell-opacity:.68;
    /* ❄️ climatisation: kept in one place so the CSS swatch/ring and the
       MapLibre circle layer can never drift apart. */
    --ac:#9c1ae8;

    --surface:#fcfcfb;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:#898781;
    --hairline:rgba(11,11,11,.10);
    --shadow:0 1px 2px rgba(11,11,11,.06), 0 8px 24px rgba(11,11,11,.10);
    --radius:12px;
    --font:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    font-family:var(--font);
    color:var(--text-primary);
    background:var(--basemap-tone);
    -webkit-font-smoothing:antialiased;
  }
  #map { position:absolute; inset:0; }

  .card {
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .panel { position:absolute; z-index:2; }
  .panel--tl { top:16px; left:16px; width:280px; }
  .panel--br { right:16px; bottom:24px; width:236px; }

  /* ---- header / status ---- */
  .hdr { padding:14px 16px 12px; }
  .hdr h1 { margin:0; font-size:15px; font-weight:650; letter-spacing:-.01em; }
  .hdr .addr { margin:2px 0 0; font-size:12px; color:var(--text-secondary); }
  .meta { margin:12px 0 0; padding:0; border-top:1px solid var(--hairline); }
  .meta dl { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; margin:10px 0 0; }
  .meta dt { font-size:11px; color:var(--text-muted); }
  .meta dd { margin:0; font-size:11px; color:var(--text-secondary); text-align:right; font-variant-numeric:tabular-nums; }
  .badge {
    display:none; align-items:center; gap:5px; margin-top:11px;
    padding:5px 8px; border-radius:7px; font-size:11px; font-weight:600;
    background:#fdf3dc; color:#6b4a00; border:1px solid #f0d9a0;
  }
  .badge[data-on="1"] { display:inline-flex; }
  .badge svg { flex:none; }

  /* ---- mode toggle ---- */
  .modes { display:flex; gap:0; margin-top:12px; padding:3px; background:#f0efec; border-radius:9px; }
  .modes button {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:7px 4px 6px; border:0; border-radius:7px; cursor:pointer;
    background:transparent; color:var(--text-secondary);
    font:inherit; font-size:10.5px; line-height:1.2; letter-spacing:-.01em;
    transition:background .12s, color .12s, box-shadow .12s;
  }
  .modes button .ico { font-size:15px; line-height:1; }
  .modes button:hover { color:var(--text-primary); }
  .modes button[aria-pressed="true"] {
    background:var(--surface); color:var(--text-primary); font-weight:600;
    box-shadow:0 1px 2px rgba(11,11,11,.10);
  }
  .modes button:focus-visible { outline:2px solid #2a78d6; outline-offset:1px; }

  /* ---- legend (doubles as the table view: each band carries its share) ---- */
  .legend { padding:13px 14px 12px; }
  .legend h2 { margin:0 0 1px; font-size:12px; font-weight:650; }
  .legend .sub { margin:0 0 9px; font-size:10.5px; color:var(--text-muted); }
  .legend table { width:100%; border-collapse:collapse; font-size:11px; }
  .legend td { padding:2px 0; vertical-align:middle; }
  .legend td.sw { width:20px; }
  .legend td.lbl { color:var(--text-secondary); font-variant-numeric:tabular-nums; }
  .legend td.pct { text-align:right; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .legend i {
    display:block; width:16px; height:11px; border-radius:2px;
    /* swatch shows the composited colour, matching the map exactly */
    background-image:linear-gradient(var(--c),var(--c));
    background-color:var(--basemap-tone);
    box-shadow:inset 0 0 0 1px rgba(11,11,11,.06);
  }
  .legend tr.nodata i { background-image:none; background:repeating-linear-gradient(45deg,#d5d2c9 0 2px,#f6f5f2 2px 5px); }
  .legend .foot { margin:9px 0 0; padding-top:8px; border-top:1px solid var(--hairline); font-size:10px; color:var(--text-muted); }

  /* ---- tooltip ---- */
  #tip {
    position:absolute; z-index:5; pointer-events:none; opacity:0;
    transform:translate3d(-9999px,-9999px,0);
    min-width:150px; padding:9px 11px 8px;
    background:var(--surface); border:1px solid var(--hairline);
    border-radius:10px; box-shadow:var(--shadow);
    font-size:11.5px; transition:opacity .09s;
  }
  #tip[data-on="1"] { opacity:1; }
  #tip .tip-hd { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  #tip .tip-hd i { width:11px; height:11px; border-radius:2px; background-color:var(--basemap-tone); flex:none; }
  #tip .tip-hd span { font-size:10px; color:var(--text-muted); }
  #tip dl { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:0; }
  #tip dt { color:var(--text-secondary); }
  #tip dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; color:var(--text-secondary); }
  #tip .on dt, #tip .on dd { color:var(--text-primary); font-weight:650; }
  #tip .na { color:var(--text-muted); font-weight:400; }

  /* ---- work marker ---- */
  .work { display:flex; align-items:center; gap:6px; transform:translateX(-7px); }
  .work .dot {
    width:14px; height:14px; border-radius:50%; flex:none;
    background:#0b0b0b; box-shadow:0 0 0 3px var(--surface), 0 1px 4px rgba(11,11,11,.4);
  }
  .work .tag {
    padding:2px 7px; border-radius:6px; white-space:nowrap;
    background:var(--surface); border:1px solid var(--hairline);
    box-shadow:0 1px 3px rgba(11,11,11,.14);
    font-size:10.5px; font-weight:600; letter-spacing:-.01em;
  }

  /* ---- flat popup ----
     z-index 3 puts it over the panels (2) but under the hover tooltip (5): the
     markers themselves stay UNDER the panels, so they can never swallow a click
     meant for the mode toggle, while a popup the user opened on purpose is
     readable even next to the header card. */
  .maplibregl-popup.flatpop { z-index:3; max-width:252px !important; }
  .flatpop .maplibregl-popup-content {
    padding:11px 13px 12px; border-radius:var(--radius);
    background:var(--surface); border:1px solid var(--hairline);
    box-shadow:var(--shadow); font-size:11.5px; color:var(--text-secondary);
  }
  .flatpop .maplibregl-popup-close-button {
    width:20px; height:20px; right:3px; top:2px; border:0; background:none;
    color:var(--text-muted); font-size:15px; line-height:18px; border-radius:5px; cursor:pointer;
  }
  .flatpop .maplibregl-popup-close-button:hover { background:#f0efec; color:var(--text-primary); }
  /* the tip is a CSS triangle: only the side facing the content is coloured,
     so it has to be tinted per anchor or the transparent sides fill in too */
  .flatpop.maplibregl-popup-anchor-top .maplibregl-popup-tip,
  .flatpop.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
  .flatpop.maplibregl-popup-anchor-top-right .maplibregl-popup-tip { border-bottom-color:var(--surface); }
  .flatpop.maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
  .flatpop.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
  .flatpop.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip { border-top-color:var(--surface); }
  .flatpop.maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color:var(--surface); }
  .flatpop.maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color:var(--surface); }

  .fp-hd { font-size:12px; font-weight:650; color:var(--text-primary); letter-spacing:-.01em; padding-right:16px; }
  .fp-price { margin-top:5px; font-size:15px; font-weight:650; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .fp-price .fp-mo { margin-left:2px; font-size:11px; font-weight:500; color:var(--text-muted); }
  .fp-price .fp-ch {
    display:inline-block; margin-left:6px; padding:1px 5px; border-radius:5px;
    background:#f0efec; color:var(--text-secondary);
    font-size:10px; font-weight:600; vertical-align:2px;
  }
  .fp-where { margin-top:6px; }
  .fp-where .fp-approx { margin-left:5px; color:var(--text-muted); font-size:10px; }
  .fp-ag { margin-top:2px; color:var(--text-muted); font-size:10.5px; }
  /* which board the ad came from. Only printed for the non-default source, so
     the line means "this one is different", not decoration on every popup. */
  .fp-src { margin-top:4px; color:var(--text-secondary); font-size:10px; font-weight:600; }
  .fp-tt { display:flex; gap:5px; margin-top:9px; padding-top:8px; border-top:1px solid var(--hairline); }
  .fp-tt .fp-t {
    flex:1; padding:4px 2px; border-radius:6px; text-align:center; white-space:nowrap;
    background:#f4f3f0; color:var(--text-primary);
    font-size:10.5px; font-weight:600; font-variant-numeric:tabular-nums;
  }
  .fp-tt .fp-t.na { color:var(--text-muted); font-weight:400; }
  .fp-link { display:inline-block; margin-top:9px; font-size:11px; font-weight:600; color:#2a6fd6; text-decoration:none; }
  .fp-link:hover { text-decoration:underline; }

  /* ---- market layer toggle (data/market.json) ----
     Sits under the meta block in the top-left card. The market is a SECOND,
     subordinate encoding: a checkbox row, not a mode button, so it can never
     be mistaken for the travel-mode control above it. */
  .mkt { margin-top:11px; padding-top:10px; border-top:1px solid var(--hairline); }
  .mkt-row { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
  .mkt-row input { margin:0; flex:none; accent-color:#3f6fbe; width:13px; height:13px; }
  .mkt-row .lbl { font-size:11.5px; font-weight:600; color:var(--text-primary); }
  .mkt-row:hover .lbl { color:#2a55a8; }
  .mkt-scale { margin-top:7px; }
  .mkt-scale[hidden] { display:none; }
  .mkt-bar {
    height:7px; border-radius:2px;
    /* the exact five ramp stops used by the circle layer */
    background:linear-gradient(90deg,#2a55a8,#4a76c2,#6d97d6,#95b8e6,#bed8f4);
    box-shadow:inset 0 0 0 1px rgba(11,11,11,.08);
  }
  .mkt-ends { display:flex; justify-content:space-between; margin-top:2px; font-size:9.5px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .mkt-note { margin:4px 0 0; font-size:9.5px; line-height:1.3; color:var(--text-muted); }
  .mkt-note b { font-weight:600; color:var(--text-secondary); }

  /* ---- market filters ----
     Sit between the toggle and the €/m² scale: controls first, then the legend
     they act on. Drawn at the same hairline weight as the ramp bar below, so
     the block reads as part of the market row rather than as a second panel
     competing with the travel-mode buttons above. */
  .mkt-filt { margin-top:8px; display:flex; flex-direction:column; gap:7px; }
  .mkt-filt[hidden] { display:none; }
  .mkt-f { display:block; cursor:pointer; }
  .mkt-f-hd { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:10px; color:var(--text-muted); }
  .mkt-f-hd b { font-weight:700; color:var(--text-secondary); font-variant-numeric:tabular-nums; }
  .mkt-f input[type=range] {
    -webkit-appearance:none; appearance:none;
    display:block; width:100%; height:11px; margin:3px 0 0;
    background:transparent; cursor:pointer;
  }
  .mkt-f input[type=range]::-webkit-slider-runnable-track { height:3px; border-radius:2px; background:var(--hairline); }
  .mkt-f input[type=range]::-moz-range-track { height:3px; border-radius:2px; background:var(--hairline); }
  .mkt-f input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:11px; height:11px; margin-top:-4px; border-radius:50%;
    background:#3f6fbe; border:1.5px solid var(--surface);
    box-shadow:0 1px 2px rgba(11,11,11,.25);
  }
  .mkt-f input[type=range]::-moz-range-thumb {
    width:11px; height:11px; border-radius:50%;
    background:#3f6fbe; border:1.5px solid var(--surface);
    box-shadow:0 1px 2px rgba(11,11,11,.25);
  }
  .mkt-f input[type=range]:focus-visible { outline:none; }
  .mkt-f input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow:0 0 0 3px rgba(63,111,190,.3); }
  .mkt-f input[type=range]:focus-visible::-moz-range-thumb { box-shadow:0 0 0 3px rgba(63,111,190,.3); }
  /* The AC switch is a FILTER, not a legend key, so it borrows the toggle
     row's shape and lives with the sliders — never the ❄️ swatch's, which
     stays down in the legend counting what is on the map. Its accent is the
     one violet, so the control and the dots it keeps say the same colour. */
  .mkt-fac .lbl { font-size:10.5px; font-weight:600; }
  .mkt-fac input { accent-color:var(--ac); }
  .mkt-fac:hover .lbl { color:#6d13a4; }

  /* ---- ❄️ climatisation spotlight ----
     AC is a BOOLEAN, so it gets a boolean encoding: one loud colour, not a
     ramp position. Bright violet is the only strongly saturated hue left once
     the commute ramp owns green→red and the market ramp owns blue, so an AC dot
     is findable at city-wide zoom without consulting the legend. The swatch
     carries the same glow the dots do, so the legend and the map match. */
  .mkt-ac { display:flex; align-items:center; gap:6px; margin-top:7px; font-size:10px; color:var(--text-secondary); }
  .mkt-ac[hidden] { display:none; }
  .mkt-ac i {
    flex:none; width:11px; height:11px; border-radius:3px; background:var(--ac);
    box-shadow:0 0 0 1.5px rgba(252,252,251,.95), 0 0 7px rgba(156,26,232,.9);
  }
  .mkt-ac b { font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  /* A CANDIDATE is a mention, not a fact, so it is drawn as the absence of a
     fill: same violet, but a ring around an ordinary dot. Hollow reads as
     "outline only = not filled in yet" without needing the legend, and it
     stays visually subordinate to the solid, glowing confirmed dots. The
     swatch is the map mark at legend scale — filled centre in the price-ramp
     blue, thick violet ring, no glow. */
  .mkt-ac.cand i {
    background:#6d97d6;
    box-shadow:0 0 0 2.5px var(--ac);
  }
  .mkt-ac.cand { color:var(--text-muted); }

  /* market popup: same shell as the flat popup, one extra "≈ / per room" line */
  .fp-sub { margin-top:3px; font-size:10.5px; color:var(--text-muted); }
  .fp-warn {
    margin-top:7px; padding:5px 7px; border-radius:6px;
    background:#fdf3dc; color:#6b4a00; border:1px solid #f0d9a0;
    font-size:10px; line-height:1.35;
  }
  .fp-ppm { color:var(--text-secondary); font-weight:600; }
  /* AC line in either popup. Only ever states "yes" for market listings —
     absence of a hit is not proof of absence, so nothing is printed then. */
  .fp-ac {
    display:inline-block; margin-top:7px; padding:2px 7px; border-radius:6px;
    background:#f4e8fd; color:#6d13a4; border:1px solid rgba(156,26,232,.28);
    font-size:10.5px; font-weight:650;
  }
  .fp-ac.no { background:#f4f3f0; color:var(--text-muted); border-color:var(--hairline); font-weight:500; }
  /* the CANDIDATE badge mirrors its dot: no fill, violet outline, quieter
     weight — so the popup says "maybe" in the same visual language the map does */
  .fp-ac.maybe {
    background:transparent; color:#6d13a4; border:1.5px solid var(--ac);
    font-weight:600; line-height:1.3;
  }
  /* alternate portals for a listing we found on more than one board */
  .fp-also { margin-top:6px; font-size:10px; color:var(--text-muted); }
  .fp-also a { color:var(--text-secondary); text-decoration:underline; }
  .fp-also a:hover { color:#2a6fd6; }

  /* ---- loading / error ---- */
  /* sits in the left column under the header card, so it can never
     collide with the title or the legend */
  #note {
    margin-top:10px; padding:9px 12px;
    font-size:11.5px; line-height:1.35; color:var(--text-secondary);
  }
  #note[hidden] { display:none; }
  #note.err { color:#8a2020; border-color:#e5b7b7; background:#fdf6f6; }

  .maplibregl-ctrl-attrib { font-size:10px; }

<script>
(function () {
  "use strict";

  /* ---------------- colour scale ---------------- */
  // Upper bound (exclusive) of each band + its ramp step. Last band is the cap.
  var BANDS = [
    { max: 10,       hex: "#74f79e", label: "< 10"  },
    { max: 20,       hex: "#8ad545", label: "10–20" },
    { max: 30,       hex: "#afa600", label: "20–30" },
    { max: 40,       hex: "#b97800", label: "30–40" },
    { max: 50,       hex: "#b64700", label: "40–50" },
    { max: 60,       hex: "#aa0700", label: "50–60" },
    { max: Infinity, hex: "#710014", label: "60+"   }
  ];
  var CELL_OPACITY = 0.68;

  function bandIndex(v) {
    for (var i = 0; i < BANDS.length; i++) if (v < BANDS[i].max) return i;
    return BANDS.length - 1;
  }

  // Continuous ramp: each former band's colour now anchors the gradient at that
  // band's centre (5, 15, … 55), capped at 60. Same seven colours, no steps.
  var VALS = [5, 15, 25, 35, 45, 55, 60];

  function colorExpression(prop) {
    var e = ["interpolate", ["linear"], ["get", prop]];
    for (var i = 0; i < VALS.length; i++) e.push(VALS[i], BANDS[i].hex);
    return e;
  }

  function lerpHex(h1, h2, f) {
    var a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
    function ch(sh) {
      var x = Math.round(((a >> sh) & 255) * (1 - f) + ((b >> sh) & 255) * f);
      return ("0" + x.toString(16)).slice(-2);
    }
    return "#" + ch(16) + ch(8) + ch(0);
  }
  // JS twin of the map expression, so swatches/tooltips match the fill exactly
  function colorAt(v) {
    if (v <= VALS[0]) return BANDS[0].hex;
    for (var i = 1; i < VALS.length; i++) {
      if (v <= VALS[i]) return lerpHex(BANDS[i - 1].hex, BANDS[i].hex, (v - VALS[i - 1]) / (VALS[i] - VALS[i - 1]));
    }
    return BANDS[VALS.length - 1].hex;
  }

  /* ---------------- config ---------------- */
  var MODES = [
    { key: "transit", prop: "t", label: "Transit", icon: "🚇" },
    { key: "bicycle", prop: "b", label: "Bike",    icon: "🚴" },
    { key: "walk",    prop: "w", label: "Walk",    icon: "🚶" }
  ];
  var DEFAULT_MODE = "transit";
  var PARIS = [2.3435, 48.8664];
  var MAX_BOUNDS = [[2.10, 48.72], [2.58, 49.00]];   // greater Paris
  var NO_DATA = -1;                                   // sentinel; filtered out, never coloured

  // ?data=… override for testing; same-origin relative paths only.
  function dataUrl() {
    var q = new URLSearchParams(location.search).get("data");
    if (q && !/^[a-z]+:|^\/\//i.test(q)) return q;
    return "data/results.json";
  }

  function cartoTiles(layer) {
    var ratio = window.devicePixelRatio > 1 ? "@2x" : "";
    return ["a", "b", "c", "d"].map(function (s) {
      return "https://" + s + ".basemaps.cartocdn.com/" + layer + "/{z}/{x}/{y}" + ratio + ".png";
    });
  }
  var ATTRIB = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>';

  /* ---------------- map ---------------- */
  // Labels ride ABOVE the heat cells so street names stay crisp under the fill.
  var map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        "carto-base":   { type: "raster", tiles: cartoTiles("light_nolabels"),    tileSize: 256, attribution: ATTRIB },
        "carto-labels": { type: "raster", tiles: cartoTiles("light_only_labels"), tileSize: 256 }
      },
      layers: [
        { id: "carto-base",   type: "raster", source: "carto-base" },
        { id: "carto-labels", type: "raster", source: "carto-labels" }
      ]

    maxZoom: 17,
    maxBounds: MAX_BOUNDS,

  });

  // In embedded panes and iframes the container is often still at its initial
  // size when the Map is constructed, and MapLibre's own resize tracking can
  // miss the settle — leaving the drawing buffer stale and the render scaled
  // into a corner. Re-measure once things have actually laid out.
  function fitContainer() { map.resize(); }
  window.addEventListener("load", fitContainer);
  window.addEventListener("resize", fitContainer);
  if (window.ResizeObserver) new ResizeObserver(fitContainer).observe(document.getElementById("map"));
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-left");
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 90, unit: "metric" }), "bottom-left");

  /* ---------------- state ---------------- */
  var mode = DEFAULT_MODE;
  var points = [];
  var tiles = {};           // step -> features
  var cellLayers = [];      // topmost last (finest last)
  var grid = null;          // { lat0, lng0, dLat, dLng, cells } — point-in-cell index
  var note = document.getElementById("note");
  var tip = document.getElementById("tip");

  function showNote(msg, isErr) {
    note.textContent = msg;
    note.classList.toggle("err", !!isErr);
    note.hidden = false;
  }

  /* ---------------- geometry ---------------- */
  function num(v) { return (typeof v === "number" && isFinite(v)) ? v : NO_DATA; }

  /* Progressive refinement without double-blending.
     -------------------------------------------------
     A coarse cell and the finer cells of a later pass overlap: a 1000 m cell
     spans +-500 m, and the 500/250 m passes then cover most of that same
     ground. Simply stacking translucent fills makes every overlap composite
     twice and read darker than its value — a checkerboard of wrong colours.
     So instead the cells are re-tiled onto one shared lattice: each point
     claims the lattice cells its square covers, finest pass first, and a
     coarse point keeps only what no finer point already claimed. The result
     is an exact, gap-free, NON-overlapping tiling where finer data always
     wins — the intent of "coarse below fine", with uniform opacity.

     Lattice unit = half the finest step. Every step is a multiple of the
     finest one and every point sits on the finest grid, so a cell of side S
     always spans a whole number of half-steps and lands on the lattice. */
  function buildTiles(pts) {
    var steps = pts.map(function (p) { return p.step; });
    var finest = Math.min.apply(null, steps);
    var unit = finest / 2;

    var refLat = pts.reduce(function (a, p) { return a + p.lat; }, 0) / pts.length;
    var dLat = unit / 111320;
    var dLng = unit / (111320 * Math.cos(refLat * Math.PI / 180));
    var lat0 = Math.min.apply(null, pts.map(function (p) { return p.lat; }));
    var lng0 = Math.min.apply(null, pts.map(function (p) { return p.lng; }));

    var claimed = Object.create(null);
    var byStep = {};

    // finest first => finer passes claim their ground before coarser ones
    pts.slice().sort(function (a, b) { return a.step - b.step; }).forEach(function (p) {
      var half = Math.round(p.step / unit) / 2;              // half-width in lattice units
      var ci = Math.round((p.lat - lat0) / dLat);            // point's lattice coords
      var cj = Math.round((p.lng - lng0) / dLng);
      // one shared props object per point: it goes on the feature AND into the
      // lattice index, so cellAt() can never disagree with what is drawn
      var props = { t: num(p.transit), b: num(p.bicycle), w: num(p.walk), step: p.step, a: 0 };
      var rings = [];

      for (var di = -half; di < half; di++) {
        for (var dj = -half; dj < half; dj++) {
          var i = ci + di, j = cj + dj;
          var key = i + ":" + j;
          if (claimed[key]) continue;
          claimed[key] = props;          // <- doubles as the point-in-cell index
          var s = lat0 + i * dLat, n = s + dLat;
          var w = lng0 + j * dLng, e = w + dLng;
          rings.push([[[w, s], [e, s], [e, n], [w, n], [w, s]]]);
        }
      }
      if (!rings.length) return;                             // fully superseded
      props.a = rings.length;                                // true area, in lattice cells

      (byStep[p.step] || (byStep[p.step] = [])).push({
        type: "Feature",
        geometry: { type: "MultiPolygon", coordinates: rings },
        properties: props
      });
    });

    grid = { lat0: lat0, lng0: lng0, dLat: dLat, dLng: dLng, cells: claimed };
    return byStep;
  }

  // lng/lat -> the props of the lattice cell containing it (finest pass wins), or null
  function cellAt(lng, lat) {
    if (!grid) return null;
    var i = Math.floor((lat - grid.lat0) / grid.dLat);
    var j = Math.floor((lng - grid.lng0) / grid.dLng);
    return grid.cells[i + ":" + j] || null;
  }

  /* ---------------- render ---------------- */
  function addCellLayers(byStep) {
    // Coarse first => coarse sits UNDERNEATH, so each refinement pass overlays
    // the previous one and progressive refinement reads correctly.
    var steps = Object.keys(byStep).map(Number).sort(function (a, b) { return b - a; });
    steps.forEach(function (step) {
      var id = "cells-" + step;
      map.addSource(id, { type: "geojson", data: { type: "FeatureCollection", features: byStep[step] } });
      map.addLayer({
        id: id,
        type: "fill",
        source: id,
        paint: {
          "fill-color": colorExpression(activeProp()),
          "fill-opacity": CELL_OPACITY,
          "fill-antialias": false          // no seams between abutting cells
        },
        filter: [">=", ["get", activeProp()], 0]
      }, "carto-labels");                  // keep basemap labels on top
      cellLayers.push(id);
    });
  }

  function activeProp() {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].key === mode) return MODES[i].prop;
    return "t";
  }
  function activeMode() {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].key === mode) return MODES[i];
    return MODES[0];
  }

  function recolor() {
    var prop = activeProp();
    cellLayers.forEach(function (id) {
      map.setPaintProperty(id, "fill-color", colorExpression(prop));
      map.setFilter(id, [">=", ["get", prop], 0]);
    });
  }

  /* ---------------- legend (also the table view: share of area per band) ----------------
     Cells differ in size, so shares are weighted by cell area (step²) — otherwise
     the dense 250 m passes would dominate the numbers.                                   */
  function renderLegend() {
    var prop = activeProp();
    var area = new Array(BANDS.length).fill(0), missing = 0, total = 0;
    Object.keys(tiles).forEach(function (step) {
      tiles[step].forEach(function (f) {
        var v = f.properties[prop];
        var a = f.properties.a;
        total += a;
        if (v < 0) { missing += a; return; }
        area[bandIndex(v)] += a;
      });
    });

    var rows = "";
    BANDS.forEach(function (b, i) {
      var pct = total ? (area[i] / total) * 100 : 0;
      var lo = i === 0 ? 0 : BANDS[i - 1].max;
      var hi = isFinite(b.max) ? b.max : 60;
      rows += '<tr><td class="sw"><i style="background-image:linear-gradient(90deg,' +
              rgba(colorAt(lo), CELL_OPACITY) + "," + rgba(colorAt(hi), CELL_OPACITY) + ')"></i></td>' +
              '<td class="lbl">' + b.label + '</td>' +
              '<td class="pct">' + fmtPct(pct) + "</td></tr>";
    });
    if (missing > 0) {
      rows += '<tr class="nodata"><td class="sw"><i></i></td>' +
              '<td class="lbl">no data</td>' +
              '<td class="pct">' + fmtPct((missing / total) * 100) + "</td></tr>";
    }
    document.getElementById("lg-rows").innerHTML = rows;
    document.getElementById("lg-sub").textContent = activeMode().label + " · share of area";
  }

  function fmtPct(p) {
    if (p === 0) return "—";
    if (p < 1) return "<1%";
    return Math.round(p) + "%";
  }
  function rgba(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }

  /* ---------------- tooltip ---------------- */
  function hideTip() { tip.setAttribute("data-on", "0"); }

  function showTip(e, f) {
    var vals = { transit: f.properties.t, bicycle: f.properties.b, walk: f.properties.w };
    var active = vals[mode];
    var head = active >= 0
      ? '<i style="background-image:linear-gradient(' + rgba(colorAt(active), CELL_OPACITY) +
        "," + rgba(colorAt(active), CELL_OPACITY) + ')"></i>'
      : "";
    var html = '<div class="tip-hd">' + head + "<span>cell " + f.properties.step + " m</span></div><dl>";
    MODES.forEach(function (m) {
      var v = vals[m.key];
      html += '<div class="' + (m.key === mode ? "on" : "") + '" style="display:contents">' +
              "<dt>" + m.icon + " " + m.label + "</dt>" +
              "<dd" + (v >= 0 ? "" : ' class="na"') + ">" + (v >= 0 ? v + " min" : "n/a") + "</dd></div>";
    });
    html += "</dl>";
    tip.innerHTML = html;
    tip.setAttribute("data-on", "1");

    // follow the cursor, flipping before it runs off the viewport
    var pad = 14, r = tip.getBoundingClientRect();
    var x = e.originalEvent.clientX + pad, y = e.originalEvent.clientY + pad;
    if (x + r.width > window.innerWidth - 8) x = e.originalEvent.clientX - r.width - pad;
    if (y + r.height > window.innerHeight - 8) y = e.originalEvent.clientY - r.height - pad;
    tip.style.transform = "translate3d(" + x + "px," + y + "px,0)";
  }

  function bindHover() {
    map.on("mousemove", function (e) {
      if (!cellLayers.length) return;
      // A market dot sits on top and is clickable, so it owns the cursor: drop
      // the cell tooltip rather than covering the dot the user is aiming at.
      if (marketVisible() &&
          map.queryRenderedFeatures(e.point, { layers: [MKT_LAYER] }).length) {
        hideTip();
        return;
      }
      // queryRenderedFeatures returns topmost first => the finest cell wins
      var f = map.queryRenderedFeatures(e.point, { layers: cellLayers })[0];
      if (!f) { hideTip(); map.getCanvas().style.cursor = ""; return; }
      map.getCanvas().style.cursor = "crosshair";
      showTip(e, f);
    });
    map.on("mouseout", hideTip);
    map.on("dragstart", hideTip);
  }

  /* ---------------- meta card ---------------- */
  function renderMeta(meta, n) {
    document.getElementById("addr").textContent = (meta.work && meta.work.address) || "—";

    var steps = (meta.steps_done || []).slice().sort(function (a, b) { return b - a; });
    document.getElementById("m-grid").textContent = steps.length
      ? steps.join(" / ") + " m" : "—";

    document.getElementById("m-dep").textContent = formatDeparture(meta.departure);
    document.getElementById("m-pts").textContent = n.toLocaleString("en-GB");
    document.getElementById("m-mock").setAttribute("data-on", meta.mock ? "1" : "0");
  }

  function formatDeparture(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    try {
      return new Intl.DateTimeFormat("en-GB", {
        weekday: "short", day: "numeric", month: "short",
        hour: "2-digit", minute: "2-digit",
        timeZone: "Europe/Paris"
      }).format(d) + " (Paris)";
    } catch (err) {
      return d.toISOString();
    }
  }

  /* ---------------- work marker ---------------- */
  function addWorkMarker(work) {
    if (!work || typeof work.lat !== "number" || typeof work.lng !== "number") return;
    var el = document.createElement("div");
    el.className = "work";
    el.innerHTML = '<span class="dot"></span><span class="tag">Work</span>';
    el.title = work.address || "Work";
    new maplibregl.Marker({ element: el, anchor: "left" })
      .setLngLat([work.lng, work.lat])
      .addTo(map);
  }

  /* ---------------- shared build: no private shortlist ----------------
     The local build carries a private shortlist overlay (dark price pills read
     from a saved-favourites file). This is the shareable page, so that overlay
     is absent by construction: no loader, no markers, and build_share.py
     embeds no such data. The small formatting helpers below stay — the market
     popups use them too.                                                     */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtEur(n) {
    return (typeof n === "number" && isFinite(n) ? n.toLocaleString("en-GB") : "—") + " €";
  }
  function fmtNum(n) {
    return typeof n === "number" ? String(n) : "";
  }
  function fmtFloor(f) {
    if (f == null || f === "") return null;
    if (/^rdc$/i.test(String(f))) return "ground floor";
    return "floor " + String(f);
  }

  /* ---------------- market sweep (data/market.json) ----------------
     Every current SeLoger listing matching the saved filters (≤3000 €, ≥2
     pièces, ≥45 m², Paris intra-muros). Hundreds of points, so this is a
     MapLibre CIRCLE LAYER, not DOM markers: one GPU draw call instead of ~600
     positioned <div>s, which is what keeps the 3D page smooth with it on.

     Colour encodes €/m² on a single-hue BLUE ramp, deliberately absent from the
     green→yellow→red commute ramp. The heat fill owns the warm half of the hue
     wheel AND the map's entire area; the market is ~600 four-pixel dots in a
     cool hue. So the commute ramp stays the dominant encoding and the dots read
     as a separate overlay rather than as more heat. Deep = cheap, pale =
     expensive, so the listings worth a look are the ones that pop.            */
  var MARKET_URL = "data/market.json";
  var MARKET_DEFAULT_ON = true;      // 2D: on. 3d.html ships this false.
  var MKT_SRC = "market", MKT_LAYER = "market-dots", MKT_GLOW = "market-ac-glow";
  var MKT_STOPS = ["#2a55a8", "#4a76c2", "#6d97d6", "#95b8e6", "#bed8f4"];
  var MKT_GREY = "#9a9a96";          // per-room (coliving) price => €/m² is meaningless
  // ❄️ climatisation. Overrides the price ramp: AC is the thing being hunted, and
  // the price is one line down in the popup anyway. Must stay in sync with --ac.
  var MKT_AC = "#9c1ae8";
  // Base dot radius per zoom; AC dots are drawn at AC_SCALE of it and get a
  // blurred halo underneath, which is what makes them readable at z10–z12 where
  // an ordinary dot is barely two pixels across.
  var MKT_R_STOPS = [[10, 2.2], [12, 3.2], [14, 4.6], [16, 6.4]];
  var AC_SCALE = 1.6, AC_GLOW_SCALE = 3.4;
  var isAC = ["==", ["get", "ac"], 1];
  // A CANDIDATE is a keyword hit, not a verified fact, so it must not borrow
  // the confirmed mark. It keeps its ordinary size AND its ordinary €/m²
  // colour — the price ramp is still the thing being read — and gains a thick
  // violet ring. Hollow vs filled is the "maybe vs yes" axis; size and glow
  // stay reserved for "yes", so a candidate can never be mistaken for one at a
  // glance, and the two never compete for attention.
  var isCand = ["==", ["get", "cand"], 1];

  // MapLibre allows exactly one zoom-driven interpolate per property, and it has
  // to be the OUTERMOST expression — so the per-feature ["case"] has to live in
  // the stop OUTPUTS, not wrap the ramp. Building the stops here keeps the two
  // radii (and the two stroke widths) provably in step.
  function zoomRamp(stops, out) {
    var e = ["interpolate", ["linear"], ["zoom"]];
    stops.forEach(function (s) { e.push(s[0], out(s[1])); });
    return e;
  }
  var marketList = [];
  var openMktPopup = null;

  // Listings share one quartier centroid — up to 35 land on the exact same
  // point — so fan each group out along a golden-angle spiral. Deterministic
  // (sorted by id, so a rebuild never reshuffles the dots) and only a few tens
  // of metres wide, well inside the neighbourhood-level error the popup already
  // declares with "≈ approx.".
  var SPIRAL_R0 = 11;                // metres; a group of 35 spans ~64 m
  var GOLDEN = 2.399963229728653;    // radians

  function spreadStacks(list) {
    var groups = {};
    list.forEach(function (l) {
      var k = l.lat.toFixed(5) + "," + l.lng.toFixed(5);
      (groups[k] || (groups[k] = [])).push(l);
    });
    Object.keys(groups).forEach(function (k) {
      var g = groups[k];
      g.sort(function (a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
      g.forEach(function (l, i) {
        if (g.length < 2) { l._lat = l.lat; l._lng = l.lng; return; }
        var r = SPIRAL_R0 * Math.sqrt(i), a = i * GOLDEN;   // i=0 keeps the centroid
        l._lat = l.lat + (r * Math.sin(a)) / 111320;
        l._lng = l.lng + (r * Math.cos(a)) /
                 (111320 * Math.cos(l.lat * Math.PI / 180));
      });
    });
    return list;
  }

  function mktFloor(f) {
    if (f == null || f === "") return null;
    var s = String(f).replace(/\s*\/\s*[–-]\s*$/, "");   // "4/–" -> "4"
    return s === "0" ? "RDC" : s;
  }

  function mktPopupHtml(l) {
    var head = [];
    if (l.rooms) head.push(l.rooms + (l.rooms === 1 ? " room" : " rooms"));
    if (l.area_m2) head.push(fmtNum(l.area_m2) + " m²");
    var fl = fmtFloor(mktFloor(l.floor));
    if (fl) head.push(fl);
    if (l.dpe) head.push("DPE " + l.dpe);

    // Read the commute off the SAME lattice index the fill uses, at the point
    // the dot is actually drawn — so the numbers can never disagree with the
    // colour under the dot.
    var cell = cellAt(l._lng, l._lat);
    var tt = MODES.map(function (m) {
      var v = cell ? cell[m.prop] : null;
      var ok = typeof v === "number" && v >= 0;
      return '<span class="fp-t' + (ok ? "" : " na") + '" title="' + esc(m.label) + '">' +
             m.icon + " " + (ok ? v + " min" : "—") + "</span>";
    }).join("");

    var ppm = l.area_m2 ? Math.round(l.price_month / l.area_m2) : null;
    var where = [l.neighborhood, l.postal].filter(Boolean).join(" · ");

    return '<div class="fp-hd">' + esc(head.join(" · ") || "Flat") + "</div>" +
      '<div class="fp-price">' + fmtEur(l.price_month) +
        '<span class="fp-mo">/mo</span>' +
        // null = the ad never said; printing "charges excl." there would invent a fact
        (l.charges_included == null
          ? ""
          : '<span class="fp-ch">' + (l.charges_included ? "charges incl." : "charges excl.") + "</span>") +
      "</div>" +
      (ppm ? '<div class="fp-sub"><span class="fp-ppm">' + ppm + " €/m²</span>" +
             (l.furnished ? " · furnished" : "") + "</div>" : "") +
      // Two different claims, said differently. "yes" is a verified fact —
      // a structured portal field or an explicit sentence in the ad. A
      // candidate is only a word found somewhere in the text, so it says so
      // out loud instead of dressing a keyword hit up as a feature.
      (l.ac
        ? '<div class="fp-ac">❄️ Air conditioning: yes</div>'
        : l.ac_candidate
          ? '<div class="fp-ac maybe">❄️ Air conditioning possible (mentioned in the ad)</div>'
          : "") +
      // PAP ads come from the owner, not an agency, and they publish a street
      // point — so they get a source line and no "≈ approx." caveat.
      (l.source === "pap" ? '<div class="fp-src">Source: PAP (from the owner)</div>' : "") +
      (where
        ? '<div class="fp-where">' + esc(where) +
          (l.geo_precision === "listing"
            ? ""
            : '<span class="fp-approx" title="exact address withheld — the dot sits on the nearest residential building of the quartier">≈ approx.</span>') +
          "</div>"
        : "") +
      (l.agency ? '<div class="fp-ag">' + esc(l.agency) + "</div>" : "") +
      (l.per_room_price_suspected
        ? '<div class="fp-warn">Looks like coliving: the price is most likely for ONE room, ' +
          'while the area and the room count are for the whole flat. €/m² here is not ' +
          'comparable with ordinary listings.</div>'
        : "") +
      '<div class="fp-tt">' + tt + "</div>" +
      (l.url
        ? '<a class="fp-link" href="' + esc(l.url) + '" target="_blank" rel="noopener">Open on ' +
          srcLabel(l.source) + " →</a>"
        : "") +
      // The same flat is often posted on several boards at once. The dot is
      // one listing, so the alternates stay secondary links rather than
      // second dots — and seeing them is also the reader's own check that the
      // dedupe fused the right two ads.
      alsoHtml(l);
  }

  // One place to turn a source tag into the board's own name, so the popup
  // link, the alternates line and the legend can never call it three things.
  var MKT_SRC_LABEL = {
    seloger: "SeLoger", pap: "PAP", bienici: "Bien'ici",
    lodgis: "Lodgis", moteurimmo: "MoteurImmo", leboncoin: "leboncoin"
  };
  function srcLabel(s) { return MKT_SRC_LABEL[s] || s || "listing"; }

  // MoteurImmo is an aggregator: the link it hands us points at whatever board
  // actually hosts the ad, which is usually neither MoteurImmo nor a board we
  // sweep. Labelling such a link "MoteurImmo" would name the finder instead of
  // the destination, so the label is read off the URL and the source tag is
  // only the fallback.
  var MKT_HOST_LABEL = {
    "seloger.com": "SeLoger", "pap.fr": "PAP", "bienici.com": "Bien'ici",
    "lodgis.com": "Lodgis", "leboncoin.fr": "leboncoin",
    "proprietes.lefigaro.fr": "Figaro", "immobilier.lefigaro.fr": "Figaro"
  };
  function hostLabel(url, fallback) {
    var m = /^https?:\/\/([^/?#]+)/i.exec(url || "");
    if (!m) return srcLabel(fallback);
    var host = m[1].toLowerCase().replace(/^www\./, "");
    return MKT_HOST_LABEL[host] || host;
  }

  function alsoHtml(l) {
    var also = l.also || [];
    if (!also.length) return "";
    return '<div class="fp-also">also on: ' + also.map(function (a) {
      return '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
             esc(hostLabel(a.url, a.source)) + "</a>";
    }).join(", ") + "</div>";
  }

  function marketGeoJSON(list) {
    return {
      type: "FeatureCollection",
      features: list.map(function (l, i) {
        return {
          type: "Feature",
          geometry: { type: "Point", coordinates: [l._lng, l._lat] },
          properties: {
            i: i,
            ppm: l.area_m2 ? l.price_month / l.area_m2 : 0,
            // raw price and area ride along so the filter sliders are pure
            // setFilter calls — no re-sourcing, no second copy of the data
            price: l.price_month || 0,
            area: l.area_m2 || 0,
            pr: l.per_room_price_suspected ? 1 : 0,
            ac: l.ac ? 1 : 0,
            // confirmed wins: a listing is never both, so the two styles can
            // never be asked to apply to the same dot
            cand: (!l.ac && l.ac_candidate) ? 1 : 0
          }
        };
      })
    };
  }

  function marketVisible() {
    return map.getLayer(MKT_LAYER) &&
           map.getLayoutProperty(MKT_LAYER, "visibility") !== "none";
  }

  // The halo and the dots are two layers with one truth, so the checkbox has to
  // move both or the glow would linger over an empty map.
  function setMarketVis(on) {
    [MKT_GLOW, MKT_LAYER].forEach(function (id) {
      if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
    });
  }

  /* ---------------- market filters ----------------
     Three narrowing controls — price ceiling, area floor, AC-only — applied
     with map.setFilter on both circle layers. No re-sourcing and no second
     copy of the listings, so dragging a slider is one style repaint per frame.

     What deliberately does NOT change: the €/m² colour domain. It is computed
     once from the whole sweep in addMarket() and stays there. Recomputing it
     per filter would recolour every dot the moment the user moved a slider —
     the same flat would read "cheap" at one setting and "expensive" at the
     next — so a filtered view stays directly comparable with an unfiltered one.
     The dots that leave are removed, never repainted.                        */
  // Seeded with the same [min, max, step] the markup declares, then overwritten
  // from the sliders themselves in initMktFilters(). The seed only matters if
  // the controls are absent, and it has to be a pass-everything filter so a
  // missing control could never silently empty the layer.
  var mktGrid = { pmax: [800, 3000, 50], amin: [45, 120, 5] };
  var mktF = { pmax: mktGrid.pmax[1], amin: mktGrid.amin[0], ac: false };
  var mktDef = { pmax: mktGrid.pmax[1], amin: mktGrid.amin[0] };   // widest = whole sweep
  var openMktL = null;                 // the listing behind openMktPopup, if any

  // The MapLibre expression below and this predicate are ONE rule said twice —
  // one paints the dots, the other counts them for the label and the legend, so
  // they must be read together. A missing price counts as 0 (passes any
  // ceiling) and a missing area as 0 (fails any floor), which is exactly what
  // ["get"] on an absent property does in the expression.
  function mktPass(l) {
    if ((l.price_month || 0) > mktF.pmax) return false;
    if ((l.area_m2 || 0) < mktF.amin) return false;
    if (mktF.ac && !(l.ac || l.ac_candidate)) return false;
    return true;
  }

  // `extra` is the layer's own STRUCTURAL filter, which has to survive whatever
  // the user picks: the glow layer exists only for confirmed AC, so passing
  // isAC in keeps it from haloing plain dots the moment a slider moves.
  function mktFilterExpr(extra) {
    var f = ["all",
      ["<=", ["get", "price"], mktF.pmax],
      [">=", ["get", "area"], mktF.amin]];
    // "cand" is already (!ac && ac_candidate), so ac|cand is exactly
    // "confirmed OR merely mentioned" with nothing counted twice.
    if (mktF.ac) f.push(["any", isAC, isCand]);
    if (extra) f.push(extra);
    return f;
  }

  function applyMktFilter() {
    if (map.getLayer(MKT_LAYER)) map.setFilter(MKT_LAYER, mktFilterExpr(null));
    if (map.getLayer(MKT_GLOW)) map.setFilter(MKT_GLOW, mktFilterExpr(isAC));
    // A popup hanging over a dot that is no longer drawn would be the card
    // describing a flat the map is currently hiding.
    if (openMktPopup && openMktL && !mktPass(openMktL)) {
      openMktPopup.remove(); openMktPopup = null; openMktL = null;
    }
    updateMktCounts();
    writeMktHash();
  }

  // Both readouts state the DIRECTION of the bound, not just the number: the
  // sliders are one-sided, and "2 400 €" alone would not say which side.
  function renderMktF() {
    var a = document.getElementById("mkt-pmax-v");
    if (a) a.textContent = "up to " + mktF.pmax.toLocaleString("en-GB") + " €";
    var b = document.getElementById("mkt-amin-v");
    if (b) b.textContent = "from " + mktF.amin + " m²";
  }

  // The toggle label and the two ❄️ legend rows count the VISIBLE subset, so
  // the card can never claim more dots than the map is drawing. "N of M" shows
  // up only once something is actually filtered out — an untouched map should
  // not have to explain itself.
  function updateMktCounts() {
    var n = marketList.length;
    var shown = marketList.filter(mktPass);
    var k = shown.length;

    var lbl = document.getElementById("mkt-lbl");
    if (lbl) {
      lbl.textContent = "Market: " + k.toLocaleString("en-GB") +
        (k === n ? "" : " of " + n.toLocaleString("en-GB")) + " " +
        (n === 1 ? "flat" : "flats");
    }

    var nAc = shown.filter(function (l) { return l.ac; }).length;
    var nCa = shown.filter(function (l) { return !l.ac && l.ac_candidate; }).length;
    var acRow = document.getElementById("mkt-ac");
    if (acRow) {
      acRow.hidden = !nAc;             // never promise a mark that is nowhere on the map
      document.getElementById("mkt-ac-n").textContent = nAc.toLocaleString("en-GB");
    }
    var candRow = document.getElementById("mkt-cand");
    if (candRow) {
      candRow.hidden = !nCa;
      document.getElementById("mkt-cand-n").textContent = nCa.toLocaleString("en-GB");
    }
  }

  /* ---- filter state in the URL hash ----
     #pmax=2400&amin=60&ac=1 — so a reload, or a link sent to yourself, opens
     the same subset. Only non-default values are written, which keeps an
     untouched map's URL clean, and unknown keys are carried through: the hash
     is not ours alone. */
  function mktHashParams() {
    return new URLSearchParams(location.hash.replace(/^#/, ""));
  }

  // A hash is hand-editable text, so snap whatever it says onto the slider's
  // own grid instead of trusting it — an off-grid value would show one number
  // and jump to another the instant the slider was touched.
  function mktSnap(v, g) {
    if (!isFinite(v)) return null;
    return Math.min(g[1], Math.max(g[0], Math.round(v / g[2]) * g[2]));
  }

  function readMktHash() {
    var q = mktHashParams();
    var p = mktSnap(parseFloat(q.get("pmax")), mktGrid.pmax);
    if (p !== null) mktF.pmax = p;
    var a = mktSnap(parseFloat(q.get("amin")), mktGrid.amin);
    if (a !== null) mktF.amin = a;
    mktF.ac = q.get("ac") === "1";
  }

  function writeMktHash() {
    var q = mktHashParams();
    if (mktF.pmax === mktDef.pmax) q.delete("pmax"); else q.set("pmax", mktF.pmax);
    if (mktF.amin === mktDef.amin) q.delete("amin"); else q.set("amin", mktF.amin);
    if (mktF.ac) q.set("ac", "1"); else q.delete("ac");
    var s = q.toString();
    // replaceState, not location.hash: one slider drag would otherwise push
    // dozens of entries onto the back button.
    history.replaceState(null, "",
      location.pathname + location.search + (s ? "#" + s : ""));
  }

  // Called BEFORE the layers are added, so a hash-restored filter is already in
  // force on the very first frame instead of being applied after a flash of the
  // whole sweep.
  function initMktFilters() {
    var sp = document.getElementById("mkt-pmax");
    var sa = document.getElementById("mkt-amin");
    var cb = document.getElementById("mkt-ac-only");
    if (!sp || !sa || !cb) return;

    // The markup owns the bounds; read them back rather than restating them
    // here, so the control, the readout and the hash share one grid.
    mktGrid.pmax = [+sp.min, +sp.max, +sp.step];
    mktGrid.amin = [+sa.min, +sa.max, +sa.step];
    // Default = the widest setting on each slider: the page opens on the whole
    // sweep, and a filter is only ever something the user asked for.
    mktF.pmax = mktDef.pmax = +sp.max;
    mktF.amin = mktDef.amin = +sa.min;

    readMktHash();
    sp.value = mktF.pmax; sa.value = mktF.amin; cb.checked = mktF.ac;
    renderMktF();
    writeMktHash();                    // normalise a sloppy or stale hash

    sp.addEventListener("input", function () {
      mktF.pmax = +sp.value; renderMktF(); applyMktFilter();
    });
    sa.addEventListener("input", function () {
      mktF.amin = +sa.value; renderMktF(); applyMktFilter();
    });
    cb.addEventListener("change", function () {
      mktF.ac = cb.checked; applyMktFilter();
    });
  }

  function addMarket(doc) {
    if (!doc || !Array.isArray(doc.listings) || !doc.listings.length) return 0;
    marketList = spreadStacks(doc.listings.slice());

    var dom = (doc.price_per_m2 && doc.price_per_m2.domain) || [28, 48];
    var lo = dom[0], hi = dom[1], stepv = (hi - lo) / (MKT_STOPS.length - 1);
    var color = ["interpolate", ["linear"], ["get", "ppm"]];
    MKT_STOPS.forEach(function (hex, i) { color.push(lo + stepv * i, hex); });

    // Before the layers: a hash-restored filter has to be in force on the
    // first painted frame, not applied afterwards over a flash of all 856 dots.
    initMktFilters();

    map.addSource(MKT_SRC, { type: "geojson", data: marketGeoJSON(marketList) });
    // No beforeId: the dots sit above the heat cells AND the basemap labels, so
    // a 4 px dot can never be buried under a street name or lost in the fill.
    // The AC halo goes down FIRST so it sits under its own dot, and its filter
    // means the 580-odd listings without AC cost nothing to draw.
    map.addLayer({
      id: MKT_GLOW,
      type: "circle",
      source: MKT_SRC,
      // isAC is this layer's STRUCTURAL filter and goes through mktFilterExpr
      // so the user's sliders can narrow it but never widen it onto plain dots
      filter: mktFilterExpr(isAC),
      layout: { visibility: MARKET_DEFAULT_ON ? "visible" : "none" },
      paint: {
        "circle-color": MKT_AC,
        "circle-radius": zoomRamp(MKT_R_STOPS, function (r) { return r * AC_GLOW_SCALE; }),
        "circle-blur": 0.75,
        "circle-opacity": 0.55
      }
    });
    map.addLayer({
      id: MKT_LAYER,
      type: "circle",
      source: MKT_SRC,
      filter: mktFilterExpr(null),
      layout: {
        visibility: MARKET_DEFAULT_ON ? "visible" : "none",
        // Painting order inside the layer: plain 0 < candidate 1 < confirmed 2,
        // so a spiral neighbour can never half-cover the one dot the user is
        // looking for, and a "maybe" never covers a "yes".
        "circle-sort-key": ["+", ["*", 2, ["get", "ac"]], ["get", "cand"]]
      },
      paint: {
        "circle-color": ["case", isAC, MKT_AC, ["==", ["get", "pr"], 1], MKT_GREY, color],
        "circle-radius": zoomRamp(MKT_R_STOPS, function (r) {
          return ["case", isAC, r * AC_SCALE, r];
        }),
        // a pale ring keeps a dot legible on the beige basemap and on the
        // darkest red cells alike, and separates neighbours inside a spiral;
        // the AC dot gets a fatter one so the violet reads as a ringed marker,
        // and the CANDIDATE's ring is fatter still relative to its dot — that
        // ring IS its whole marking, so it has to survive down to z10.
        // [confirmed, candidate, plain] per zoom stop.
        "circle-stroke-width": zoomRamp([[10, [1.4, 1.3, 0.6]], [14, [2.4, 2.5, 1]]], function (w) {
          return ["case", isAC, w[0], isCand, w[1], w[2]];
        }),
        "circle-stroke-color": ["case", isAC, "#ffffff", isCand, MKT_AC, "rgba(252,252,251,.92)"],
        "circle-opacity": ["case", isAC, 1, isCand, 1, 0.95]
      }
    });

    map.on("click", MKT_LAYER, function (e) {
      var f = e.features && e.features[0];
      if (!f) return;
      var l = marketList[f.properties.i];
      if (!l) return;
      if (openMktPopup) openMktPopup.remove();
      openMktL = l;
      openMktPopup = new maplibregl.Popup({
        offset: 9, closeButton: true, closeOnClick: true,
        className: "flatpop", maxWidth: "252px"
      }).setLngLat([l._lng, l._lat]).setHTML(mktPopupHtml(l)).addTo(map);
    });
    map.on("mouseenter", MKT_LAYER, function () { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", MKT_LAYER, function () { map.getCanvas().style.cursor = ""; });

    renderMarketUI(doc);
    return marketList.length;
  }

  // "candidate" means the word was found and nothing confirmed it — so a
  // listing that IS confirmed is never also counted as a maybe. Defined once,
  // because the legend count and the dot style have to agree exactly.
  function nCand() {
    return marketList.filter(function (l) { return !l.ac && l.ac_candidate; }).length;
  }

  function renderMarketUI(doc) {
    var box = document.getElementById("mkt");
    if (!box) return;
    box.hidden = false;

    var p = doc.price_per_m2 || {};
    var dom = p.domain || [28, 48];
    document.getElementById("mkt-lo").textContent = Math.round(dom[0]) + " €";
    document.getElementById("mkt-hi").textContent = Math.round(dom[1]) + " €";

    var bits = [];
    // The cap is a SeLoger fact (its 1 327 hits vs the ~600 walked), so it has
    // to be counted against the SeLoger dots alone once a second board is in.
    var src = doc.sources || {};
    var nSel = (src.seloger && src.seloger.listings) || doc.swept;
    if (doc.reported_total && doc.reported_total > nSel) {
      bits.push("SeLoger: showing <b>" + nSel.toLocaleString("en-GB") + "</b> of <b>" +
                doc.reported_total.toLocaleString("en-GB") + "</b> (newest first).");
    }
    if (p.per_room_price_suspected) {
      bits.push("<b>" + p.per_room_price_suspected + "</b> grey dots — coliving (price per room).");
    }
    bits.push("SeLoger dots are snapped to residential buildings of their own quartier " +
              "(approximate address).");
    // Five boards now feed this layer, and they are not interchangeable: PAP is
    // owners, Lodgis is AC-filtered, Bien'ici and MoteurImmo publish real
    // coordinates. Name each one with its own count instead of a single total
    // that would hide which evidence came from where.
    var mix = ["pap", "bienici", "lodgis", "moteurimmo"].map(function (s) {
      var k = marketList.filter(function (l) { return l.source === s; }).length;
      if (!k) return null;
      var extra = s === "pap" ? " from owners" : s === "lodgis" ? " ❄️" : "";
      return "<b>" + k.toLocaleString("en-GB") + "</b> " + srcLabel(s) + extra;
    }).filter(Boolean);
    if (mix.length) {
      bits.push("+ " + mix.join(" · ") +
                ". Bien'ici, Lodgis and PAP dots sit at the listing's own address.");
    }
    // Say out loud how far the AC check got: a violet dot is a claim in the ad,
    // and its ABSENCE is not a claim about anything. Coverage now comes two
    // ways — descriptions we read, and structured portal fields — so report the
    // union rather than letting the older number speak for the bigger sweep.
    var acDoc = doc.ac || {};
    var covered = acDoc.covered || acDoc.verified;
    if (covered && covered < doc.swept) {
      bits.push("❄️ checked on <b>" + covered.toLocaleString("en-GB") +
                "</b> of <b>" + doc.swept.toLocaleString("en-GB") +
                "</b> (SeLoger/PAP descriptions + structured fields from Bien'ici and Lodgis) — " +
                "no mark \u2260 no air conditioning.");
    }
    if (nCand()) {
      bits.push("A ring means the word \u201Cclimatisation\u201D was merely mentioned — " +
                "not a confirmation.");
    }
    document.getElementById("mkt-note").innerHTML = bits.join(" ");

    // The toggle label and both ❄️ keys count the visible subset, and each key
    // only appears if that subset actually holds any — so the legend never
    // promises a mark that is nowhere on the map.
    updateMktCounts();

    var cb = document.getElementById("mkt-on");
    var scale = document.getElementById("mkt-scale");
    var filt = document.getElementById("mkt-filt");
    cb.checked = MARKET_DEFAULT_ON;
    scale.hidden = !MARKET_DEFAULT_ON;
    if (filt) filt.hidden = !MARKET_DEFAULT_ON;
    cb.addEventListener("change", function () {
      setMarketVis(cb.checked);
      scale.hidden = !cb.checked;
      // The filters only mean anything while the layer is drawn, so they leave
      // with it — and their state survives in the hash for when it comes back.
      if (filt) filt.hidden = !cb.checked;
      if (!cb.checked && openMktPopup) {
        openMktPopup.remove(); openMktPopup = null; openMktL = null;
      }
    });
  }

  function loadMarket() {
    // build_share.py inlines the file as window.EMBEDDED_MARKET so the
    // single-file build works over file://, same as EMBEDDED_DATA.
    var p = window.EMBEDDED_MARKET
      ? Promise.resolve(window.EMBEDDED_MARKET)
      : fetch(MARKET_URL, { cache: "no-store" }).then(function (r) {
          if (!r.ok) return null;        // 404 = "no sweep yet", not an error
          return r.json();
        });
    return p.then(addMarket).catch(function (err) {
      console.warn("[market] skipped:", err && err.message);
    });
  }

  /* ---------------- mode toggle ---------------- */
  Array.prototype.forEach.call(document.querySelectorAll(".modes button"), function (btn) {
    btn.addEventListener("click", function () {
      if (btn.dataset.mode === mode) return;
      mode = btn.dataset.mode;
      Array.prototype.forEach.call(document.querySelectorAll(".modes button"), function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
      });
      recolor();
      renderLegend();
      hideTip();
    });
  });

  /* ---------------- boot ---------------- */
  function load(url, isFallback) {
    var dataP = window.EMBEDDED_DATA
      ? Promise.resolve(window.EMBEDDED_DATA)
      : fetch(url, { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error(r.status + " " + r.statusText);
          return r.json();
        });
    return dataP.then(function (doc) {
      if (!doc || !Array.isArray(doc.points)) throw new Error("no points array");
      // The pipeline writes results.json incrementally and starts it empty,
      // so "loaded but no points yet" is a normal state, not a success.
      if (!doc.points.length) throw new Error("file is still empty (0 points)");
      points = doc.points;
      var meta = doc.meta || {};
      renderMeta(meta, points.length);
      addWorkMarker(meta.work);
      if (meta.work && typeof meta.work.lat === "number") {
        map.setCenter([meta.work.lng, meta.work.lat]);
      }
      tiles = buildTiles(points);
      addCellLayers(tiles);
      recolor();
      renderLegend();
      bindHover();
      loadMarket();              // same reason — market popups read cellAt() too
      if (isFallback) showNote("No data yet — showing the demo set " + url);
      else note.hidden = true;
    });
  }

  map.on("load", function () {
    var url = dataUrl();
    showNote("Loading data…");
    load(url, false).catch(function (err) {
      if (url === "data/results.json") {
        return load("data/sample-results.json", true).catch(function (e2) {
          showNote("Could not load data: " + err.message, true);
        });
      }
      showNote("Could not load " + url + ": " + err.message, true);
    });
  });

  map.on("error", function (e) {
    var msg = (e && e.error && e.error.message) || "";
    if (/tile|AbortError/i.test(String(msg))) return;   // transient tile misses are noise
    console.error("[map]", msg || e);
  });
})();
</script>
</body>
</html>
